name: GitRex profile evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  render:
    name: Test and render profile animation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Render live GitHub activity
        run: python -m gitrex live --login "$GITHUB_REPOSITORY_OWNER" --output-dir output
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit updated animation
        run: |
          git add output/trex.gif output/trex.png output/preview.html output/summary.json
          if git diff --cached --quiet; then
            echo "Generated outputs are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GitRex profile animation"
          git push
