[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "gitrex"
version = "2.0.0"
description = "An originally illustrated animated T-Rex powered by GitHub activity"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.4,<13"]
license = {text = "MIT"}
[project.scripts]
gitrex = "gitrex.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
